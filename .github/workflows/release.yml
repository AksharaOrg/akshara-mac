name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-latest
    environment: release
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Import Apple signing certificates
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_SIGNING_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          decode_base64() {
            python3 -c 'import base64, pathlib, sys; raw = "".join(sys.argv[1].replace("\\n", "\n").split()); pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(raw, validate=True))' "$1" "$2"
          }
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          decode_base64 "$APP_CERTIFICATE_BASE64" "$RUNNER_TEMP/app-signing.p12"
          decode_base64 "$INSTALLER_CERTIFICATE_BASE64" "$RUNNER_TEMP/installer-signing.p12"
          security import "$RUNNER_TEMP/app-signing.p12" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer-signing.p12" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      - name: Notarize and package
        env:
          AKSHARA_VERSION: ${{ github.ref_name }}
          AKSHARA_APP_SIGN_IDENTITY: "Developer ID Application: Lahiru Himesh Madusanka Siddha Dewayala Gedara (8292UX7379)"
          AKSHARA_PKG_SIGN_IDENTITY: "Developer ID Installer: Lahiru Himesh Madusanka Siddha Dewayala Gedara (8292UX7379)"
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          AKSHARA_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          AKSHARA_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(sys.argv[1]))' "$APPLE_API_KEY_BASE64" "$RUNNER_TEMP/AuthKey_${AKSHARA_NOTARY_KEY_ID}.p8"
          export AKSHARA_NOTARY_KEY="$RUNNER_TEMP/AuthKey_${AKSHARA_NOTARY_KEY_ID}.p8"
          ./script/package.sh
          spctl --assess --type install --verbose=4 "dist/Akshara-${GITHUB_REF_NAME}.pkg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG_PATH="dist/Akshara-${GITHUB_REF_NAME}.pkg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PKG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PKG_PATH" --title "Akshara ${GITHUB_REF_NAME#v}" --generate-notes
          fi
