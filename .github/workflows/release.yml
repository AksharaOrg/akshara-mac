name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-latest
    environment: release
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Only allow releases from commits that are on the main branch.
      # This prevents a tag pushed to an unreviewed commit from triggering
      # the signing workflow and publishing a release.
      - name: Verify tag commit is on main branch
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TAG_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(git rev-parse origin/main)
          if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
            echo "::error::Release tags must point to the current main commit ($MAIN_COMMIT), not $TAG_COMMIT."
            exit 1
          fi
          echo "Branch check passed: tag points to current main commit $MAIN_COMMIT."

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use strict semantic versioning: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Import Apple signing certificates
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_SIGNING_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          printf '%s' "$APP_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/app-signing.p12"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/installer-signing.p12"
          security import "$RUNNER_TEMP/app-signing.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer-signing.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      - name: Notarize and package all architectures
        env:
          AKSHARA_VERSION: ${{ github.ref_name }}
          AKSHARA_APP_SIGN_IDENTITY: "Developer ID Application: Lahiru Himesh Madusanka Siddha Dewayala Gedara (8292UX7379)"
          AKSHARA_PKG_SIGN_IDENTITY: "Developer ID Installer: Lahiru Himesh Madusanka Siddha Dewayala Gedara (8292UX7379)"
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          AKSHARA_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          AKSHARA_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${AKSHARA_NOTARY_KEY_ID}.p8"
          export AKSHARA_NOTARY_KEY="$RUNNER_TEMP/AuthKey_${AKSHARA_NOTARY_KEY_ID}.p8"
          for architecture in universal arm64 x86_64; do
            AKSHARA_ARCH="$architecture" ./script/package.sh
            PACKAGE="dist/Akshara-${GITHUB_REF_NAME}-${architecture}.pkg"
            pkgutil --check-signature "$PACKAGE"
            spctl --assess --type install --verbose=4 "$PACKAGE"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG_PATHS=(
            "dist/Akshara-${GITHUB_REF_NAME}-universal.pkg"
            "dist/Akshara-${GITHUB_REF_NAME}-arm64.pkg"
            "dist/Akshara-${GITHUB_REF_NAME}-x86_64.pkg"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${PKG_PATHS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${PKG_PATHS[@]}" --title "Akshara ${GITHUB_REF_NAME#v}" --generate-notes
          fi
